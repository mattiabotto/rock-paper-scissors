<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
</head>
<body>
  <h1>Rock Paper Scissors!</h1>
  <p>Try to beat the Computer!</p>
  
  <div id="choice-container">
    <button id="rock-btn">Rock</button>
    <button id="paper-btn">Paper</button>
    <button id="scissors-btn">Scissors</button>
  </div>

  <div id="results">
    <div id="round-result"></div>
    <div id="human-score"></div>
    <div id="computer-score"></div>
  </div>
  
  <script src="./game-script.js" defer></script>
</body>
</html>
