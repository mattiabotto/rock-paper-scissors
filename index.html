<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Original+Surfer&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/style.css">
  <title>Rock Paper Scissors</title>
</head>
<body>
  <div class="game-container">
    <h1>Rock Paper Scissors!</h1>
    <p>Try to beat the Computer!</p>
    
    <div id="choice-container" class="flex space-even">
      <button id="rock-btn">Rock</button>
      <button id="paper-btn">Paper</button>
      <button id="scissors-btn">Scissors</button>
    </div>
    <div id="results" class="flex vertical shrink">
      <div id="round-result"></div>
      <div id="scores" class="flex space-between">
        <div id="human-score" class="score"></div>
        <div id="computer-score" class="score"></div>
      </div>
    </div>
  </div>
  
  <script src="./game-script.js" defer></script>
</body>
</html>
